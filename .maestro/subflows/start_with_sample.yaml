# Fresh install → first sample profile → matching screen → results loaded.
appId: com.mmipoc
---
- launchApp:
    clearState: true
- tapOn:
    id: "find-my-stalls"
- tapOn:
    id: "sample-sample-fabrication-owner"
- tapOn:
    id: "submit-profile"
- extendedWaitUntil:
    visible:
      id: "view-results"
    timeout: 10000
- tapOn:
    id: "view-results"
- extendedWaitUntil:
    visible:
      id: "latency-badge"
      text: "\d+\.\d\d s · .*"
    timeout: 10000
