# Open the #1 stall and see the score breakdown; back closes the sheet, not the screen.
appId: com.mmipoc
name: Stall detail sheet
---
- runFlow: subflows/start_with_sample.yaml
- tapOn: "#1 · Hall 1 · .*"
- assertVisible: "Why this is a \d+% match"
- assertVisible: "Semantic similarity"
- back
- assertNotVisible: "Why this is a \d+% match"
- assertVisible:
    id: "latency-badge"
