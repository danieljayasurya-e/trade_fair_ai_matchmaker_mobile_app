# Filter by booth row, check the chip appears, then clear.
appId: com.mmipoc
name: Filter by row and clear
---
- runFlow: subflows/start_with_sample.yaml
- tapOn:
    id: "open-filters"
- tapOn: "Row L[A-F]"
- tapOn:
    id: "apply-filters"
- assertVisible: "Row L[A-F]  ✕"
- tapOn: "Clear all"
- assertNotVisible: "Row L[A-F]  ✕"
