# Edit interests → list recomputes → rank-change badges appear.
appId: com.mmipoc
name: Edit profile re-ranks results
---
- runFlow: subflows/start_with_sample.yaml
- tapOn: "Profile"
- tapOn: "Edit my details"
- scrollUntilVisible:
    element: "Quantum Technologies"
    direction: DOWN
- tapOn: "Quantum Technologies"
- tapOn: "Laser Safety"
- scrollUntilVisible:
    element:
      id: "submit-profile"
    direction: DOWN
- tapOn:
    id: "submit-profile"
- extendedWaitUntil:
    visible: "↑\d+|↓\d+|New"
    timeout: 10000
